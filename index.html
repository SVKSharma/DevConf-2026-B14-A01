<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <!-- Google Fonts link -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <title>DEVCONF 2026</title>
  </head>
  <body>
    <header class="header">
      <nav class="main-navbar keep-the-content-center">
        <div class="logo">
          <img
            src="./assets/logo-dark-color.png"
            alt="DEVCONF Logo"
            id="logo-img"
          />
          <div class="logo-text-parent">
            <span class="logo-text-brand">DEVCONF</span>
            <span class="logo-text-year">2026</span>
          </div>
        </div>
        <div class="nav-link-parent">
          <ul class="nav-links">
            <li><a href="#speakers">Speakers</a></li>
            <li><a href="#schedule">Schedule</a></li>
            <li><a href="#tracks">Tracks</a></li>
            <li><a href="#venue">Venue</a></li>
            <li><a href="#blog">Blog</a></li>
          </ul>
        </div>
        <div class="register-button common-button">
          <a href="#register-now">Register</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="hero-section-parent">
        <div class="hero-section-content">
          <div class="hero-text-content">
            <h1 class="hero-title">Code. <em>Connect.</em> Create.</h1>
            <p class="hero-subtitle">
              Join 4,000+ engineers, founders, and builders at the premier
              developer <br> conference of 2026. Three days of cutting-edge talks,
              hands-on workshops, <br>and meaningful connections.
            </p>
          </div>
          <div class="hero-section-register-button common-button">
            <a href="#register-now-button" class="hero-register-child"
              >Register Now</a
            >
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
